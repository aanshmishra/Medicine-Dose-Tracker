<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Medicine Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Apply the saved theme before the page paints, so there's no flash.
    try {
      const t = localStorage.getItem("medicineTracker:theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 1 1 7-7l7 7a4.95 4.95 0 1 1-7 7Z" />
          <path d="m8.5 8.5 7 7" />
        </svg>
      </div>
      <div>
        <h1>Medicine Tracker</h1>
        <p id="today-label" class="today-label"></p>
      </div>
    </div>
    <div class="header-right">
      <button id="theme-btn" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button id="share-btn" class="icon-btn" title="Share with other nurses" aria-label="Share with other nurses">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
      <button id="days-left" class="days-left" title="Tap to change days left">
        <span id="days-left-number">–</span>
        <span class="days-left-label">days left</span>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="1" role="tab">
      <span class="tab-name">1x</span><span class="tab-count" data-count="1"></span>
    </button>
    <button class="tab" data-tab="4" role="tab">
      <span class="tab-name">4x</span><span class="tab-count" data-count="4"></span>
    </button>
    <button class="tab" data-tab="6" role="tab">
      <span class="tab-name">6x</span><span class="tab-count" data-count="6"></span>
    </button>
  </nav>

  <main>
    <section class="progress-card">
      <div class="progress-text">
        <span id="progress-title" class="progress-title">Today's doses</span>
        <span id="progress-count" class="progress-count"></span>
      </div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    </section>

    <div id="all-done" class="all-done hidden">
      <span class="all-done-icon">✓</span>
      <span>All doses taken today</span>
    </div>

    <ul id="dose-list" class="dose-list"></ul>
  </main>

  <!-- First-open / edit dialog -->
  <div id="setup" class="overlay hidden">
    <form id="setup-form" class="dialog">
      <div class="dialog-icon" aria-hidden="true">💊</div>
      <h2>How many days of medicine are left?</h2>
      <p class="dialog-sub">This counts down by one every day and is shared with all nurses.</p>
      <input id="setup-days" type="number" inputmode="numeric" min="0" max="3650" required placeholder="e.g. 30" />
      <button type="submit" class="primary">Save</button>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
